aid: goethena
name: Goethena
description: >-
  Ethena (goethena.com) is an AI-powered compliance training and ethics platform
  used by 2,000+ organizations to run harassment prevention, code of conduct, data
  privacy, anti-bribery, and regulatory compliance programs across their workforce.
  Its Agentic Compliance product line pairs AI agents (Training, Disclosure, Policy,
  and Third-Party Risk) with a 200+ course library, an employee ethics hotline, HR
  case management, assignment automation, and reporting — with a human always
  approving what the agents draft. Ethena exposes a REST API (api.goethena.com) for
  managing learners, training campaigns, learner training campaigns and modules, and
  webhooks, so customers can sync roster and training-completion data with their HRIS
  and downstream systems. Backed by Felicis.
